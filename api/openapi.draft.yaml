openapi: 3.0.3
info:
  title: DRT Platform API
  version: 1.1.0
  description: DRT Platform API for workforce management
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: api.drt.kpmg.com
        description: API host

security:
  - EntraOAuth2:
    - "api://drt-backend-api/user_impersonation"

paths:
  /core-asks:
    post:
      summary: Create a new Core ASK
      description: Create a new Core ASK and either save it as a draft or submit it for review, based on buttonValue. Exit makes no change.
      operationId: createCoreAsk
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID to ensure idempotent processing of retry requests
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoreAskRequest'
      responses:
        '201':
          description: Core ASK created successfully with Save & Exit or SUBMIT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCoreAskResponse'
        '200':
          description: Exit button - no changes persisted
        '400':
          description: Validation failed - missing required field, inactive reference ID, or constraint violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - caller lacks Create New ASK permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict - duplicate Idempotency-Key with different request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service unavailable - reference data, employee, or attachment service down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    EntraOAuth2:
      type: oauth2
      description: >-
        Microsoft Entra ID, OAuth 2.0 Authorization Code Flow with PKCE.
        The API validates issuer, tenant, audience, signature and lifetime.
      flows:
        authorizationCode:
          authorizationUrl: "https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/authorize"
          tokenUrl: "https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/token"
          scopes:
            "api://drt-backend-api/user_impersonation": "Access DRT on behalf of the signed-in user"

  schemas:
    CreateCoreAskRequest:
      type: object
      description: Request body for creating a new Core ASK
      required:
        - coreAskDetails
        - buttonValue
      properties:
        coreAskDetails:
          $ref: '#/components/schemas/CoreAskDetails'
        comment:
          type: string
          description: Optional comment text
        documents:
          type: array
          description: Optional array of document references
          items:
            $ref: '#/components/schemas/DocumentReference'
        buttonValue:
          type: string
          description: Action button value - controls save/submit/exit behavior
          enum:
            - Save & Exit
            - SUBMIT
            - Exit

    CoreAskDetails:
      type: object
      description: Core ASK business data
      required:
        - coreAskName
        - dppGroupId
        - needReasonId
        - generalSpecialityNeedId
        - levelNeedId
        - projectedStartDate
        - headCountAmount
        - fteAmount
        - titlingCategory
        - roleSummary
        - roleResponsibility
        - roleQualification
      properties:
        coreAskName:
          type: string
          description: Name of the Core ASK
          maxLength: 200
        dppGroupId:
          type: integer
          format: int32
          description: DPP Group identifier - must be active
        needReasonId:
          type: integer
          format: int32
          description: Need reason identifier - must be active
        generalSpecialityNeedId:
          type: integer
          format: int32
          description: General/Specialty need identifier - must be active
        generalSpecialityNeedComment:
          type: string
          description: Comment for general/specialty need - required unless first option selected
        levelNeedId:
          type: integer
          format: int32
          description: Level need identifier - must be active
        pml:
          type: string
          description: PML field - optional, new-version only
          maxLength: 99
        projectedStartDate:
          type: string
          format: date
          description: Projected start date in ISO 8601 format
        endDate:
          type: string
          format: date
          description: End date in ISO 8601 format - must be after projectedStartDate and not before today
        outgoingResource:
          type: string
          description: Outgoing resource name - derived from employeeId, read-only
          readOnly: true
        employeeId:
          type: integer
          format: int32
          description: Employee identifier - must be valid
        headCountAmount:
          type: integer
          format: int32
          description: Headcount amount - must be positive
          minimum: 1
        fteAmount:
          type: number
          format: double
          description: FTE amount - must not exceed headCountAmount
          minimum: 0
        rolePostingId:
          type: integer
          format: int32
          description: Role posting identifier - required for top-3 levels, must be active
        numberofresources:
          type: integer
          format: int32
          description: Number of resources
        titlingCategory:
          type: string
          description: Titling category - required, new-version only
        transitionalCoach:
          type: string
          description: Transitional coach - optional, new-version only
          maxLength: 99
        roleSummary:
          type: string
          description: Role summary - required
        roleResponsibility:
          type: string
          description: Role responsibility - required
        roleQualification:
          type: string
          description: Role qualification - required

    DocumentReference:
      type: object
      description: Reference to a previously uploaded document
      required:
        - documentId
        - name
      properties:
        documentId:
          type: string
          format: uuid
          description: Unique identifier of the uploaded document
        name:
          type: string
          description: Display name of the document

    CreateCoreAskResponse:
      type: object
      description: Response body for successfully created Core ASK
      required:
        - askId
        - askDetailId
        - coreAskDetails
        - version
        - task
        - auditHistory
      properties:
        askId:
          type: string
          format: uuid
          description: Unique identifier for the created ASK
        askDetailId:
          type: string
          format: uuid
          description: Unique identifier for the ASK detail record
        coreAskDetails:
          type: object
          description: Echo of the created Core ASK business data
        version:
          type: integer
          format: int32
          description: Version number - always 1 for new ASK
        task:
          $ref: '#/components/schemas/TaskInfo'
        comment:
          $ref: '#/components/schemas/CommentInfo'
        auditHistory:
          $ref: '#/components/schemas/AuditHistoryInfo'

    TaskInfo:
      type: object
      description: Created workflow task information
      required:
        - taskId
        - statusId
        - assigneeId
      properties:
        taskId:
          type: string
          format: uuid
          description: Unique identifier for the created task
        statusId:
          type: integer
          format: int32
          description: Workflow status ID - 123 In Progress, 127 PPL Review, or 145 DPP Ops Review
          enum:
            - 123
            - 127
            - 145
        assigneeId:
          type: string
          format: uuid
          description: Identifier of the assigned user or group

    CommentInfo:
      type: object
      description: Created comment information - present only if comment was provided
      required:
        - commentId
      properties:
        commentId:
          type: string
          format: uuid
          description: Unique identifier for the created comment

    AuditHistoryInfo:
      type: object
      description: Audit history record for the creation event
      required:
        - auditId
      properties:
        auditId:
          type: string
          format: uuid
          description: Unique identifier for the audit history record

    ProblemDetails:
      type: object
      description: RFC 7807 problem response, as emitted by ASP.NET Core.
      required:
        - type
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          example: "https://drt.kpmg.com/errors/validation-failed"
        title:
          type: string
          description: Short, human-readable summary. Stable for a given type.
          example: "One or more validation errors occurred."
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          description: Explanation specific to this occurrence.
          example: "endDate must be later than projectedStartDate."
        instance:
          type: string
          description: The request path this occurred on.
          example: "/api/v1/core-asks"
        code:
          type: string
          description: Stable DRT error code. Safe for clients to branch on.
          example: "DRT-CORE-ASK-0012"
        traceId:
          type: string
          description: W3C trace identifier for the request.
          example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        errors:
          type: object
          description: >-
            Field-level validation failures. Present on 400 and 422 only.
            Each key is the field name; each value is the list of messages for it.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            fteAmount:
              - "fteAmount must not exceed headCountAmount."
            endDate:
              - "endDate must not be earlier than today."
